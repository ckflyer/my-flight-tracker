<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MyPilot · Log in</title>
  {% include "partials/app_shell.html" %}
  <link rel="stylesheet" href="/static/app.css?v={{ version }}">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
    }
    .wrap { width: 100%; max-width: 380px; }
    .brand { text-align: center; font-size: 1.15rem; font-weight: 700; letter-spacing: 0.02em; margin-bottom: 1.5rem; }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }
    .card h2 { font-size: 0.95rem; font-weight: 600; margin-bottom: 1rem; color: var(--text); }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.3rem; }
    input[type="text"], input[type="password"] {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.65rem 0.75rem;
      font-size: 1rem;
      margin-bottom: 0.85rem;
    }
    input[name="code"] {
      letter-spacing: 0.4em;
      font-size: 1.4rem;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    button {
      width: 100%;
      padding: 0.7rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .divider {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      margin: 1.25rem 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .error {
      background: rgba(239,68,68,0.12);
      color: #ef4444;
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">MyPilot</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <div class="card">
      <h2>Pilot login</h2>
      <form method="post" action="/login/pilot">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username"
               value="{{ username|default('', true)|e }}" required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password"
               {% if username %}autofocus{% endif %} required>
        <button type="submit">Log in</button>
      </form>
      <p style="text-align:center; font-size:0.8rem; color:var(--muted); margin-top:0.85rem;">
        <a href="/login/forgot" style="color:var(--accent);">Forgot password?</a> ·
        New user? <a href="/register" style="color:var(--accent);">Register</a>
      </p>
    </div>

    <div class="divider">or</div>

    <div class="card">
      <h2>Viewer access</h2>
      <form method="post" action="/login/code">
        <label for="code">5-digit tracking code</label>
        <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="off" required>
        <button type="submit">View flights</button>
      </form>
    </div>
  </div>
{% include "partials/sw_register.html" %}
</body>
</html>
