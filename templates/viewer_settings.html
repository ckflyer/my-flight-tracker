<!DOCTYPE html>
<html lang="en" data-theme="{{ theme }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pilot Tracker · Settings</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="shortcut icon" href="/static/favicon.ico">
  <style>
    :root, [data-theme="dark"] {
      --bg: #0f1419; --card: #1a2332; --accent: #3b82f6;
      --text: #e7ecf3; --muted: #8b9bb4; --border: #334155;
    }
    [data-theme="light"] {
      --bg: #f1f5f9; --card: #ffffff; --accent: #2563eb;
      --text: #0f172a; --muted: #64748b; --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
      max-width: 480px; margin: 0 auto;
    }
    .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom: 1.5rem; }
    .brand { font-size: 0.95rem; font-weight: 700; }
    .back-link { color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    h1 { font-size: 1.3rem; margin-bottom: 0.35rem; }
    .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
    .card { background: var(--card); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.4rem; }
    select {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); padding: 0.6rem 0.7rem; font-size: 0.95rem;
      margin-bottom: 1rem;
    }
    button {
      width: 100%; padding: 0.7rem; background: var(--accent); color: white;
      border: none; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer;
    }
    .hint { font-size: 0.78rem; color: var(--muted); margin-top: 1rem; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">Pilot Tracker</div>
    <a href="/" class="back-link">Back to Tracker</a>
  </div>
  <h1>Display settings</h1>
  <p class="sub">These are just for you, on this device — they don't change anything for anyone else viewing this schedule.</p>

  <div class="card">
    <form method="post" action="/viewer-settings">
      <label for="theme">Theme</label>
      <select name="theme" id="theme">
        <option value="dark" {% if theme == 'dark' %}selected{% endif %}>Dark</option>
        <option value="light" {% if theme == 'light' %}selected{% endif %}>Light</option>
      </select>

      <label for="time_format">Time format</label>
      <select name="time_format" id="time_format">
        <option value="24" {% if tf == '24' %}selected{% endif %}>24-hour</option>
        <option value="12" {% if tf == '12' %}selected{% endif %}>12-hour</option>
      </select>

      <button type="submit">Save</button>
    </form>
    <p class="hint">Stored in your browser, not tied to any account.</p>
  </div>
</body>
</html>
