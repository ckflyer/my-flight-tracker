<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pilot Tracker · Reset password</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v={{ version }}">
  <link rel="shortcut icon" href="/static/favicon.ico?v={{ version }}">
  <link rel="stylesheet" href="/static/app.css?v={{ version }}">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
    }
    .wrap { width: 100%; max-width: 380px; }
    .brand { text-align: center; font-size: 1.15rem; font-weight: 700; margin-bottom: 0.35rem; }
    .sub { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
    .card { background: var(--card); border-radius: 14px; padding: 1.5rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.3rem; margin-top: 0.85rem; }
    label:first-child { margin-top: 0; }
    input[type="text"], input[type="password"] {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); padding: 0.65rem 0.75rem; font-size: 1rem;
    }
    input[name="recovery_code"] { font-family: ui-monospace, monospace; letter-spacing: 0.05em; }
    button {
      width: 100%; margin-top: 1.25rem; padding: 0.7rem; background: var(--accent);
      color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer;
    }
    .error {
      background: rgba(239,68,68,0.12); color: #ef4444; border-radius: 8px;
      padding: 0.65rem 0.85rem; font-size: 0.85rem; margin-bottom: 1rem;
    }
    .back { text-align: center; font-size: 0.8rem; color: var(--muted); margin-top: 0.85rem; }
    .back a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Pilot Tracker</div>
    <div class="sub">Reset your password using your recovery code</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <div class="card">
      <form method="post" action="/login/forgot">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required>

        <label for="recovery_code">Recovery code</label>
        <input type="text" id="recovery_code" name="recovery_code" placeholder="XXXX-XXXX-XXXX" autocomplete="off" required>

        <label for="new_password">New password</label>
        <input type="password" id="new_password" name="new_password" autocomplete="new-password" minlength="8" required>

        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="8" required>

        <button type="submit">Reset password</button>
      </form>
    </div>
    <p class="back"><a href="/login">Back to log in</a></p>
  </div>
</body>
</html>
