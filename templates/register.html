<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pilot Tracker · Register</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v={{ version }}">
  <link rel="shortcut icon" href="/static/favicon.ico?v={{ version }}">
  <link rel="stylesheet" href="/static/app.css?v={{ version }}">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
    }
    .wrap { width: 100%; max-width: 380px; }
    .brand { text-align: center; font-size: 1.15rem; font-weight: 700; letter-spacing: 0.02em; margin-bottom: 0.35rem; }
    .sub { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
    .card { background: var(--card); border-radius: 14px; padding: 1.5rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.3rem; margin-top: 0.85rem; }
    label:first-child { margin-top: 0; }
    input[type="text"], input[type="password"], input[type="email"] {
      width: 100%;
      background: #0f1419;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.65rem 0.75rem;
      font-size: 1rem;
    }
    .hint { font-size: 0.75rem; color: var(--muted); margin-top: 0.3rem; }
    button {
      width: 100%;
      margin-top: 1.25rem;
      padding: 0.7rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .error {
      background: rgba(239,68,68,0.12);
      color: #ef4444;
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Pilot Tracker</div>
    <div class="sub">For crew only &mdash; creates an account that owns a schedule.</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <div class="card">
      <form method="post" action="/register">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required minlength="3">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
        <div class="hint">At least 8 characters.</div>

        <label for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required minlength="8">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email">

        <button type="submit">Create account</button>
      </form>
      <p style="text-align:center; font-size:0.8rem; color:var(--muted); margin-top:0.85rem;">
        Already have an account? <a href="/login" style="color:var(--accent);">Log in</a><br>
        Following someone else's flights? <a href="/login" style="color:var(--accent);">Use their tracking code</a>
      </p>
    </div>
  </div>
</body>
</html>
