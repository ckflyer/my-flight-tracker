services:
  flight-tracker:
    build: .
    container_name: flight-tracker
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data                    # database + backups. Point at a TrueNAS dataset.
    environment:
      - TZ=${TZ:-America/Chicago}           # server timezone

      # --- optional. Uncomment to change from the default. ---------------
      # - PT_RETENTION_DAYS=365             # days to keep flights/tracks. 0 = forever. See BACKUP.md
      # - PT_HOME_CALLSIGN=ENY              # ICAO prefix your own legs fly under
      # - PT_CANDIDATE_CALLSIGNS=ENY,AAL,JIA,PDT   # prefixes to try for a deadhead, cheapest first
      # - PT_DEBUG_LOG=1                    # record why legs closed. Read at /admin. Off = fewer writes
      # - PT_DEBUG_MAX_EVENTS=20000         # decision log ring size
      # - PT_SECRET_KEY=                    # pins login sessions across a DB rebuild. Generate ONCE:
      #                                     #   python3 -c "import secrets; print(secrets.token_hex(32))"

      # ADS-B feeds. Normally leave these alone and manage feeds at /admin —
      # setting either one PINS the list and the admin page can't change it.
      # - ADSB_ENDPOINTS=https://api.adsb.lol/v2,https://opendata.adsb.fi/api/v2
      # - ADSB_API_KEY=                     # only if a feed issues you credentials
