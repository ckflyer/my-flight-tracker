services:
  flight-tracker:
    build: .
    container_name: flight-tracker
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Everything persistent lives here: flighttracker.db holds schedule
      # legs, accounts, and breadcrumb positions. Point this at a TrueNAS
      # dataset.
      - ./data:/app/data
    environment:
      # Live tracking needs no credentials — Airplanes.live requires no API
      # key or account.
      - TZ=${TZ:-America/Chicago}
      # OPTIONAL. Pins the session-signing key so logins survive absolutely
      # anything, including the database being rebuilt from scratch. Leave
      # it commented out and the key is kept in the database automatically.
      # To use it, generate one ONCE and never change it:
      #     python3 -c "import secrets; print(secrets.token_hex(32))"
      # - PT_SECRET_KEY=paste_the_generated_value_here
